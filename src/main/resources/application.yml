spring:
  application:
    name: tabletap
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

tabletap:
  jwt:
    ttl: 8h
    cookie-secure: true
