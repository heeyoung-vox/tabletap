spring:
  application:
    name: tabletap
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Loads lazy collections for many parents in one query, which avoids
        # N+1 selects when listing items with their option groups.
        default_batch_fetch_size: 50
  mvc:
    problemdetails:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health

tabletap:
  jwt:
    ttl: 8h
    cookie-secure: true
