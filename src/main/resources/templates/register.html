<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register · TableTap</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth">
    <h1>Register your restaurant</h1>
    <p class="lead">Set up your menu and table QR codes.</p>
    <form data-endpoint="/api/auth/register">
        <div class="field">
            <label for="restaurantName">Restaurant name</label>
            <input id="restaurantName" name="restaurantName" type="text" maxlength="120" required>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="button primary" type="submit">Create account</button>
        <p class="error" role="alert"></p>
    </form>
    <p class="switch">Already registered? <a th:href="@{/login}">Log in</a></p>
</main>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
