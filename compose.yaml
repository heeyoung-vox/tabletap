# Local run of the whole app: `docker compose up`, then open http://localhost:8080
# and log in as owner@pho.demo / tabletap-demo.
# For development with ./gradlew bootRun, start only the database:
# `docker compose up postgres`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tabletap
      POSTGRES_USER: tabletap
      POSTGRES_PASSWORD: tabletap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabletap -d tabletap"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tabletap
    ports:
      - "8080:8080"

volumes:
  pgdata:
