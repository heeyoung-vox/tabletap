# Production on one small server: `docker compose -f compose.prod.yaml up -d --build`.
# Settings come from a .env file next to this one (see .env.example).
# Only Caddy is reachable from outside. It gets an HTTPS certificate for DOMAIN.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tabletap
      POSTGRES_USER: tabletap
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabletap -d tabletap"]
      interval: 5s
      retries: 10
    mem_limit: 256m

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/tabletap
      DB_USERNAME: tabletap
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
